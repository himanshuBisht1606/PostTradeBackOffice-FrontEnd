name: Deploy Frontend — Prod

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: "20"

jobs:
  lint-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check
        continue-on-error: true # TODO: remove once formatting is fixed

  build-and-deploy:
    name: Build, Push & Deploy to Prod VM
    runs-on: ubuntu-latest
    needs: lint-typecheck
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name and short SHA
        id: vars
        run: |
          echo "short=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/posttrade-frontend" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ secrets.PROD_API_BASE_URL }}
            VITE_ENV=prod
            VITE_APP_NAME=PostTrade Clearing Platform
          tags: |
            ${{ steps.vars.outputs.image }}:prod-${{ steps.vars.outputs.short }}
            ${{ steps.vars.outputs.image }}:prod-latest

      - name: Copy docker-compose file to Prod VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_VM_HOST }}
          username: opc
          key: ${{ secrets.VM_SSH_KEY }}
          source: docker-compose.frontend.prod.yml
          target: ~/posttrade-frontend/

      - name: Deploy to Prod VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ steps.vars.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.PROD_VM_HOST }}
          username: opc
          key: ${{ secrets.VM_SSH_KEY }}
          envs: IMAGE,GHCR_TOKEN,GHCR_ACTOR
          script: |
            cd ~/posttrade-frontend

            echo "$GHCR_TOKEN" | docker login ghcr.io \
              --username "$GHCR_ACTOR" \
              --password-stdin

            docker pull "$IMAGE:prod-latest"

            docker compose -f docker-compose.frontend.prod.yml up -d --pull always --force-recreate

            docker image prune -f

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_VM_HOST }}
          username: opc
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            sleep 15
            curl --fail --silent http://localhost:3000/health \
              && echo "Frontend health check passed" \
              || (echo "Frontend health check failed" && exit 1)
